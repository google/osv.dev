apiVersion: batch/v1
kind: CronJob
metadata:
  name: cve5-to-osv
  labels:
    cronLastSuccessfulTimeMins: "180"
spec:
  timeZone: Australia/Sydney
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      template:
        spec:
          containers:
          - name: cve5-to-osv
            image: cve5-to-osv
            imagePullPolicy: Always
            resources:
              requests:
                cpu: "2"
                memory: "4G"
              limits:
                cpu: "3"
                memory: "8G"
            env:
              - name: GITTER_HOST
                value: http://gitter-service:8888
          restartPolicy: Never
