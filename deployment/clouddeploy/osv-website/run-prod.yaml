apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: osv-website
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '1'
        run.googleapis.com/vpc-access-connector: projects/oss-vdb/locations/us-west2/connectors/connector
    spec:
      containers:
      - image: osv-website
        env:
        - name: OSV_VULNERABILITIES_BUCKET
          value: 'osv-vulnerabilities'
        - name: OSV_LINTER_BUCKET
          value: 'osv-public-import-logs'
        - name: OSV_API_URL
          value: 'api.osv.dev'
        - name: REDISHOST
          value: '10.85.52.228'
        - name: REDISPORT
          value: '6379'
        startupProbe:
          httpGet:
            path: /healthz
        livenessProbe:
          httpGet:
            path: /healthz
        resources:
          limits:
            cpu: 1
            memory: 4Gi
