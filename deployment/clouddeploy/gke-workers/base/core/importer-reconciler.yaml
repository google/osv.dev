apiVersion: batch/v1
kind: CronJob
metadata:
  name: importer-reconciler
  labels:
    cronLastSuccessfulTimeMins: "1500" # Expected latency once a day
spec:
  timeZone: "Australia/Sydney"
  schedule: "23 4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: importer
            image: importer
            imagePullPolicy: Always
            args: ["--reconcile=true"]
            env:
              - name: GITTER_HOST
                value: http://gitter-service:8888
              - name: IMPORT_TRACE_SAMPLE_RATE # for the overall importer trace
                value: "1.0"
              - name: TRACE_SAMPLE_RATE # for the individual vulnerability entries
                value: "0.05"
              - name: REIMPORT_TASK_POOL
                value: "reimport"
            resources:
              requests:
                cpu: "2"
                memory: "10G"
              limits:
                cpu: "3"
                memory: "11G"
          restartPolicy: Never
