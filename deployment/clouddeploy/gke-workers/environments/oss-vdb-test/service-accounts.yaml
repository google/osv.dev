# GKE Workload Identity ServiceAccounts for oss-vdb-test workers cluster.
# High-risk workloads (gitter, backup, grafana/monitoring, vulnfeeds) are isolated
# onto dedicated least-privilege GSAs; core pipeline workloads bind to osv-worker.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: osv-worker
  annotations:
    iam.gke.io/gcp-service-account: osv-worker@oss-vdb-test.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: osv-gitter
  annotations:
    iam.gke.io/gcp-service-account: osv-gitter@oss-vdb-test.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: osv-backup
  annotations:
    iam.gke.io/gcp-service-account: osv-backup@oss-vdb-test.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: osv-monitoring
  annotations:
    iam.gke.io/gcp-service-account: osv-monitoring@oss-vdb-test.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: osv-vulnfeeds
  annotations:
    iam.gke.io/gcp-service-account: osv-vulnfeeds@oss-vdb-test.iam.gserviceaccount.com
---
# Annotates the existing custom-metrics-stackdriver-adapter KSA (installed via
# deployment/README.md) so HPA keeps working once GKE_METADATA is enabled.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: custom-metrics-stackdriver-adapter
  namespace: custom-metrics
  annotations:
    iam.gke.io/gcp-service-account: osv-monitoring@oss-vdb-test.iam.gserviceaccount.com
