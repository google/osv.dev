apiVersion: batch/v1
kind: CronJob
metadata:
  name: vanir-signatures
  labels:
    cronLastSuccessfulTimeMins: "660"
spec:
  schedule: "0 */6 * * *"
  timeZone: "Australia/Sydney"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: vanir-signatures
            image: vanir-signatures
            imagePullPolicy: Always
            resources:
              requests:
                cpu: "12"
                memory: "100Gi"
              limits:
                cpu: "28"
                memory: "220Gi"
            env:
              - name: POSTGRES_PORT
                value: "6432"
              - name: POSTGRES_USER
                value: "osv-worker"
              - name: POSTGRES_DB
                value: "osv"
              - name: POSTGRES_SSLMODE
                value: "require"
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: osv-db-worker-password
                    key: password
          nodeSelector:
            cloud.google.com/gke-nodepool: highend
          tolerations:
          - key: workloadType
            operator: Equal
            value: highend
          restartPolicy: Never
