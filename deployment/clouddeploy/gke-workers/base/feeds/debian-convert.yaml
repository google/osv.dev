apiVersion: batch/v1
kind: CronJob
metadata:
  name: debian-convert
  labels:
    cronLastSuccessfulTimeMins: "180"
spec:
  timeZone: "Australia/Sydney"
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      template:
        spec:
          containers:
          - name: debian-convert
            image: debian-convert
            imagePullPolicy: Always
            resources:
              requests:
                cpu: "1"
                memory: "1G"
              limits:
                cpu: "1"
                memory: "2G"
          restartPolicy: Never
