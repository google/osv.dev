apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      serviceAccountName: grafana-sa
      containers:
      - name: grafana
        image: grafana/grafana:10.4.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: GF_SECURITY_ALLOW_EMBEDDING
          value: "false"
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "false"
        - name: GF_AUTH_PROXY_ENABLED
          value: "true"
        - name: GF_AUTH_PROXY_HEADER_NAME
          value: "X-Goog-Authenticated-User-Email"
        - name: GF_AUTH_PROXY_HEADER_PROPERTY
          value: "email"
        - name: GF_AUTH_PROXY_AUTO_SIGN_UP
          value: "true"
        - name: GF_INSTALL_PLUGINS
          value: "googlecloud-monitoring-datasource,googlecloud-logging-datasource,yesoreyeram-infinity-datasource"
        - name: GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS
          value: "yesoreyeram-infinity-datasource"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: datasources-provisioning
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        - name: dashboards-provisioning
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: dashboards-storage
          mountPath: /etc/grafana/dashboards
          readOnly: true
      - name: gmp-frontend-proxy
        image: gke.gcr.io/prometheus-engine/frontend:v0.19.0-gke.2
        args:
        - "--web.listen-address=0.0.0.0:9090"
        - "--project-id=oss-vdb"
        ports:
        - name: promql
          containerPort: 9090
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: grafana-storage
        emptyDir: {}
      - name: datasources-provisioning
        configMap:
          name: grafana-datasources
      - name: dashboards-provisioning
        configMap:
          name: grafana-dashboards-provisioning
      - name: dashboards-storage
        configMap:
          name: grafana-dashboards
          optional: true
