apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: osv-monitoring
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: osv-monitoring
    spec:
      containers:
      - name: grafana
        image: ghcr.io/credativ/plutono:v7.5.52@sha256:5e5c86066c5adc0e7fa06f33eeb3396ac6f98cf1f387253c681fb7783c610f5e
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: PL_SECURITY_ALLOW_EMBEDDING
          value: "true"
        - name: PL_AUTH_ANONYMOUS_ENABLED
          value: "false"
        - name: PL_AUTH_BASIC_ENABLED
          value: "false"
        - name: PL_AUTH_DISABLE_LOGIN_FORM
          value: "true"
        - name: PL_AUTH_DISABLE_SIGNOUT_MENU
          value: "true"
        - name: PL_AUTH_PROXY_ENABLED
          value: "true"
        - name: PL_AUTH_PROXY_HEADER_NAME
          value: "X-Goog-Authenticated-User-Email"
        - name: PL_AUTH_PROXY_HEADER_PROPERTY
          value: "username"
        - name: PL_AUTH_PROXY_AUTO_SIGN_UP
          value: "true"
        - name: PL_USERS_AUTO_ASSIGN_ORG
          value: "true"
        - name: PL_USERS_AUTO_ASSIGN_ORG_ROLE
          value: "Viewer"
        - name: PL_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
          value: "/etc/plutono/dashboards/executive-overview.json"
        - name: PL_SERVER_ROOT_URL
          value: "https://monitoring.test.osv.dev"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: datasources
          mountPath: /etc/plutono/provisioning/datasources
          readOnly: true
        - name: dashboards-prov
          mountPath: /etc/plutono/provisioning/dashboards
          readOnly: true
        - name: dashboards
          mountPath: /etc/plutono/dashboards
          readOnly: true
        - name: storage
          mountPath: /var/lib/plutono
      - name: gmp-frontend
        image: gke.gcr.io/prometheus-engine/frontend:v0.18.2-gke.1@sha256:35ab356d969255dd7694ae371bf0991b97907451b4c7e1574b58a096d3be5977
        args:
        - "--web.listen-address=127.0.0.1:9090"
        - "--query.project-id=$(GOOGLE_CLOUD_PROJECT)"
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: oss-vdb-test
        ports:
        - name: gmp-proxy
          containerPort: 9090
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboards-prov
        configMap:
          name: grafana-dashboards-prov
      - name: dashboards
        configMap:
          name: grafana-dashboards
      - name: storage
        emptyDir: {}
