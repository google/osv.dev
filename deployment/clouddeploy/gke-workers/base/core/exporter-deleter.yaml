apiVersion: batch/v1
kind: CronJob
metadata:
  name: exporter-deleter
  labels:
    cronLastSuccessfulTimeMins: "780"
spec:
  timeZone: "Australia/Sydney"
  # Twice a day, offset from the exporter's */15 schedule.
  schedule: "7 3,15 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: exporter-deleter
            image: exporter-deleter
            imagePullPolicy: Always
            resources:
              requests:
                cpu: "1"
                memory: "4G"
              limits:
                cpu: "2"
                memory: "6G"
            env:
              - name: TRACE_SAMPLE_RATE
                value: "0.0"
          restartPolicy: Never
