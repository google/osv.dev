apiVersion: batch/v1
kind: CronJob
metadata:
  name: importer-reconciler
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: importer
            env:
            - name: GOOGLE_CLOUD_PROJECT
              value: private-osv
            - name: WORKER_TASK_TOPIC
              value: "osv-work"
            # We don't have a dedicated reimport pool for this private deployment,
            # so route reimports to the default pool.
            - name: REIMPORT_TASK_POOL
              value: "default"
            args: ["--reconcile=true"]
