  waitFor: ['build-exporter-deleter', 'cloud-build-queue']

- name: gcr.io/cloud-builders/docker
  args: ['buildx', 'build', '--load', '-t', 'gcr.io/oss-vdb/record-checker:latest', '-t', 'gcr.io/oss-vdb/record-checker:$COMMIT_SHA', '--target', 'recordchecker', '--build-context', 'bindings=../bindings', '-f', 'Dockerfile', '--pull', '.']
  dir: 'go'
  id: 'build-record-checker'
  waitFor: ['build-importer']
  volumes:
  - name: 'docker-config'
    path: '/root/.docker'
- name: gcr.io/cloud-builders/docker
  args: ['push', '--all-tags', 'gcr.io/oss-vdb/record-checker']
