apiVersion: apps/v1
kind: Deployment
metadata:
  name: workers-reimport
spec:
  template:
    spec:
      containers:
      - name: workers-reimport
        env:
          - name: GOOGLE_CLOUD_PROJECT
            value: oss-vdb-test
          - name: OSV_VULNERABILITIES_BUCKET
            value: osv-test-vulnerabilities
          - name: POSTGRES_HOST
            value: "172.24.1.3"
