apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-quality-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-quality-dashboard
  template:
    metadata:
      labels:
        app: data-quality-dashboard
    spec:
      containers:
      - name: dashboard
        image: data-quality-dashboard
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: GCS_BUCKET
          value: osv-test-cve-osv-conversion
        - name: PORT
          value: "8080"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: data-quality-dashboard
spec:
  selector:
    app: data-quality-dashboard
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
