# In this directory, run the following command to build this builder:
# $ gcloud builds submit . --project=oss-vdb --config=cloudbuild.yaml
substitutions:
  _GOOSE_VERSION: 3.28.0
  _CLOUD_SQL_PROXY_VERSION: 2.26.0
steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
  - build
  - --build-arg
  - GOOSE_VERSION=${_GOOSE_VERSION}
  - --build-arg
  - CLOUD_SQL_PROXY_VERSION=${_CLOUD_SQL_PROXY_VERSION}
  - --tag
  - gcr.io/${PROJECT_ID}/goose:${_GOOSE_VERSION}
  - --tag
  - gcr.io/${PROJECT_ID}/goose:latest
  - .
- name: 'gcr.io/${PROJECT_ID}/goose:${_GOOSE_VERSION}'
  args: ['version']
images:
  - 'gcr.io/${PROJECT_ID}/goose:${_GOOSE_VERSION}'
  - 'gcr.io/${PROJECT_ID}/goose:latest'
tags: ['cloud-builders-community']
