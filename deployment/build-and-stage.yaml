# TODO(michaelkedar): This is intentionally separate from staging.yaml
# to not break existing deployment process as new one is implemented
# eventually, they can probably be combined

steps:
- name: gcr.io/cloud-builders/git
  args: ['submodule', 'update', '--init', '--recursive']
  id: 'setup'

# Poll currently-running Cloud Builds until this is the earliest-started build from this trigger/tag.
# This is to avoid potential misordering of docker images and staging deployments
# in the case when multiple commits to master occur close to one another.
- name: gcr.io/cloud-builders/gcloud
  entrypoint: bash
  args:
  - '-c'
  - |
    read current_build <<< $(gcloud builds list --region=us-west1 --filter=tags="build-and-stage" --format="value(id)" --sort-by=create_time --ongoing)
    if [[ -z "${current_build}" ]]; then
      echo "Could not find any matching builds."
      exit 1
    fi
    while [[ "${current_build}" != "${BUILD_ID}" ]]; do
      echo "Waiting for build ${current_build}"
      sleep 30
      read current_build <<< $(gcloud builds list --region=us-west1 --filter=tags="build-and-stage" --format="value(id)" --sort-by=create_time  --ongoing)
      if [[ -z "${current_build}" ]]; then
        echo "Could not find any matching builds."
        exit 1
      fi
    done
    echo "Finished waiting for other builds."
  id: 'cloud-build-queue'
  waitFor: ['-']

# Docker Image creation and tagging
# Build/push worker-base image if there's an update.
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  args: ['-c', 'docker pull gcr.io/oss-vdb/worker-base:latest || exit 0']
  id: 'pull-worker-base'
  waitFor: ['setup']
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/oss-vdb/worker-base:latest', '-t', 'gcr.io/oss-vdb/worker-base:$COMMIT_SHA', '-f', 'docker/worker-base/Dockerfile', '--cache-from', 'gcr.io/oss-vdb/worker-base:latest', '--pull', '.']
  id: 'build-worker-base'
  waitFor: ['pull-worker-base']
- name: gcr.io/cloud-builders/docker
  args: ['push', '--all-tags', 'gcr.io/oss-vdb/worker-base']
  waitFor: ['build-worker-base', 'cloud-build-queue']

# Build/push core worker images.
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  args: ['-c', 'docker pull gcr.io/oss-vdb/worker:latest || exit 0']
  id: 'pull-worker'
  waitFor: ['pull-worker-base']
- name: gcr.io/cloud-builders/docker
  args: ['build', '--build-arg', 'BUILDKIT_INLINE_CACHE=1', '--build-arg', 'CACHEBUST=$COMMIT_SHA', '-t', 'gcr.io/oss-vdb/worker:latest', '-t', 'gcr.io/oss-vdb/worker:$COMMIT_SHA', '-f', 'gcp/workers/worker/Dockerfile', '--cache-from', 'gcr.io/oss-vdb/worker:latest', '.']
  id: 'build-worker'
  waitFor: ['build-worker-base', 'pull-worker']
- name: gcr.io/cloud-builders/docker
  args: ['push', '--all-tags', 'gcr.io/oss-vdb/worker']
  waitFor: ['build-worker', 'cloud-build-queue']

- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  args: ['-c', 'docker pull gcr.io/oss-vdb/oss-fuzz-worker:latest || exit 0']
  id: 'pull-oss-fuzz-worker'
  waitFor: ['pull-worker-base']
- name: gcr.io/cloud-builders/docker
  args: ['build', '--build-arg', 'BUILDKIT_INLINE_CACHE=1', '--build-arg', 'CACHEBUST=$COMMIT_SHA', '-t', 'gcr.io/oss-vdb/oss-fuzz-worker:latest', '-t', 'gcr.io/oss-vdb/oss-fuzz-worker:$COMMIT_SHA', '-f', 'gcp/workers/oss_fuzz_worker/Dockerfile', '--cache-from', 'gcr.io/oss-vdb/oss-fuzz-worker:latest', '.']
  id: 'build-oss-fuzz-worker'
  waitFor: ['build-worker-base', 'pull-oss-fuzz-worker']
- name: gcr.io/cloud-builders/docker
  args: ['push', '--all-tags', 'gcr.io/oss-vdb/oss-fuzz-worker']
  waitFor: ['build-oss-fuzz-worker', 'cloud-build-queue']

- name: gcr.io/cloud-builders/docker
  args: ['build', '-t', 'gcr.io/oss-vdb/oss-fuzz-importer:latest', '-t', 'gcr.io/oss-vdb/oss-fuzz-importer:$COMMIT_SHA', '.']
  dir: 'gcp/workers/oss_fuzz_importer'
  id: 'build-oss-fuzz-importer'
  waitFor: ['build-oss-fuzz-worker']
- name: gcr.io/cloud-builders/docker
  args: ['push', '--all-tags', 'gcr.io/oss-vdb/oss-fuzz-importer']
  waitFor: ['build-oss-fuzz-importer', 'cloud-build-queue']

# Build/push go images
# build-importer warms the shared builder stage and BuildKit Go caches (/go/pkg/mod, /root/.cache/go-build).
# Subsequent Go builds are scheduled into 4 bounded lanes (plus vanir-signatures and website) via waitFor
# to cap BuildKit concurrency on E2_HIGHCPU_32 — these waitFor edges are concurrency slots, not functional deps:
#   Lane 1: osv-worker -> relations -> osv-server
#   Lane 2: exporter -> generatesitemap -> recoverer
#   Lane 3: exporter-deleter -> custommetrics -> staging-api-test -> first-package-finder
#   Lane 4: record-checker -> gitter -> ubuntu-binary-mapper -> osv-linter
#   Heavy (unlaned): vanir-signatures, website (also waits on frontend3 & hugo)
- name: 'gcr.io/cloud-builders/docker'
  args: ['buildx', 'create', '--name', 'osv-builder', '--use', '--bootstrap', '--driver-opt', 'network=host']
  id: 'setup-buildx'
  waitFor: ['-']
  volumes:
  - name: 'docker-config'
    path: '/root/.docker'

- name: gcr.io/cloud-builders/docker
  args: ['buildx', 'build', '--load', '-t', 'gcr.io/oss-vdb/importer:latest', '-t', 'gcr.io/oss-vdb/importer:$COMMIT_SHA', '--target', 'importer', '--build-context', 'bindings=../bindings', '-f', 'Dockerfile', '--pull', '.']
  dir: 'go'
  id: 'build-importer'
  waitFor: ['setup', 'setup-buildx']
  volumes:
  - name: 'docker-config'
    path: '/root/.docker'
- name: gcr.io/cloud-builders/docker
  args: ['push', '--all-tags', 'gcr.io/oss-vdb/importer']
  waitFor: ['build-importer', 'cloud-build-queue']

- name: gcr.io/cloud-builders/docker
  args: ['buildx', 'build', '--load', '-t', 'gcr.io/oss-vdb/osv-worker:latest', '-t', 'gcr.io/oss-vdb/osv-worker:$COMMIT_SHA', '--target', 'worker', '--build-context', 'bindings=../bindings', '-f', 'Dockerfile', '--pull', '.']
  dir: 'go'
  id: 'build-osv-worker'
  waitFor: ['build-importer']
  volumes:
  - name: 'docker-config'
    path: '/root/.docker'
- name: gcr.io/cloud-builders/docker
  args: ['push', '--all-tags', 'gcr.io/oss-vdb/osv-worker']
  waitFor: ['build-osv-worker', 'cloud-build-queue']

- name: gcr.io/cloud-builders/docker
  args: ['buildx', 'build', '--load', '-t', 'gcr.io/oss-vdb/exporter:latest', '-t', 'gcr.io/oss-vdb/exporter:$COMMIT_SHA', '--target', 'exporter', '--build-context', 'bindings=../bindings', '-f', 'Dockerfile', '--pull', '.']
  dir: 'go'
  id: 'build-exporter'
  waitFor: ['build-importer']
  volumes:
  - name: 'docker-config'
    path: '/root/.docker'
- name: gcr.io/cloud-builders/docker
  args: ['push', '--all-tags', 'gcr.io/oss-vdb/exporter']
