apiVersion: apps/v1
kind: Deployment
metadata:
  name: workers
spec:
  template:
    spec:
      containers:
      - name: worker-private
        env:
          - name: GOOGLE_CLOUD_PROJECT
            value: oss-vdb-test
          - name: OSV_VULNERABILITIES_BUCKET
            value: osv-test-vulnerabilities
          - name: POSTGRES_HOST
            value: "172.24.1.3"
        resources:
          requests:
            cpu: "0.9"
            memory: "1.2Gi"
          limits:
            cpu: "1.5"
            memory: "1.3Gi"