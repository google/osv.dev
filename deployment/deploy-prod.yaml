steps:
# Fetch PostgreSQL migrations at the release commit and apply to prod and private-osv
- name: gcr.io/cloud-builders/git
  entrypoint: bash
  env: ['COMMIT_SHA=$COMMIT_SHA']
  args:
  - '-c'
  - |
    set -euo pipefail
    git clone --filter=blob:none --no-checkout https://github.com/google/osv.dev.git repo
    cd repo
    git sparse-checkout set go/internal/database/postgres/migrations
    git checkout "$COMMIT_SHA"
- name: gcr.io/oss-vdb/goose
  env: ['CLOUDSQL_INSTANCE=oss-vdb:us-central1:osv-db']
  args: ['up']
  dir:  repo/go/internal/database/postgres/migrations
- name: gcr.io/oss-vdb/goose
  env: ['CLOUDSQL_INSTANCE=private-osv:us-west2:osv-db']
  args: ['up']
  dir:  repo/go/internal/database/postgres/migrations

# Promote Cloud Deploy
- name: gcr.io/cloud-builders/gcloud
  args: ['deploy', 'releases', 'promote', '--quiet', '--release=osv-$SHORT_SHA', '--region=us-central1', '--delivery-pipeline=gke-workers', '--to-target=production-workers', '--annotations=tag=$TAG_NAME']
- name: gcr.io/cloud-builders/gcloud
  args: ['deploy', 'releases', 'promote', '--quiet', '--release=osv-$SHORT_SHA', '--region=us-central1', '--delivery-pipeline=osv-api', '--to-target=production-api-multi', '--annotations=tag=$TAG_NAME']
- name: gcr.io/cloud-builders/gcloud
  args: ['deploy', 'releases', 'promote', '--quiet', '--release=osv-$SHORT_SHA', '--region=us-central1', '--delivery-pipeline=gke-indexer', '--to-target=production-indexer', '--annotations=tag=$TAG_NAME']
- name: gcr.io/cloud-builders/gcloud
  args: ['deploy', 'releases', 'promote', '--quiet', '--release=osv-$SHORT_SHA', '--region=us-central1', '--delivery-pipeline=osv-website', '--to-target=production-website', '--annotations=tag=$TAG_NAME']

# Deploy OSS-Fuzz workers
- name: gcr.io/cloud-builders/gcloud
  args: ['deploy', 'releases', 'create', 'osv-$SHORT_SHA', '--project=oss-vdb', '--region=us-central1', '--delivery-pipeline=oss-fuzz-workers', '--images', 'worker=gcr.io/oss-vdb/oss-fuzz-worker:$COMMIT_SHA,importer=gcr.io/oss-vdb/oss-fuzz-importer:$COMMIT_SHA,cron=gcr.io/oss-vdb/cron:$COMMIT_SHA', '--annotations=tag=$TAG_NAME']
  dir: 'oss-fuzz-workers'

# Promote through to private instance also
- name: gcr.io/cloud-builders/gcloud
  args: ['deploy', 'releases', 'promote', '--quiet', '--release=osv-$SHORT_SHA', '--region=us-central1', '--delivery-pipeline=gke-workers', '--to-target=private-workers', '--annotations=tag=$TAG_NAME']

# Tag every deployed image from this release with $TAG_NAME so Artifact Registry
# cleanup policies preserve released versions.
#
# Instead of hardcoding every image (which drifts whenever a new service is added),
# we query Cloud Deploy's release records for osv-$SHORT_SHA across all pipelines
# and tag every referenced image, plus any extra non-Cloud-Deploy images listed below.
- name: gcr.io/cloud-builders/gcloud
  id: 'tag-release-images'
  env:
  - 'COMMIT_SHA=$COMMIT_SHA'
  - 'SHORT_SHA=$SHORT_SHA'
  - 'TAG_NAME=$TAG_NAME'
  script: |
    #!/usr/bin/env bash
    set -euo pipefail

    # Extra images deployed or used outside Cloud Deploy pipelines (e.g. shared base
    # images, standalone Cloud Run Jobs). Add new ones here as needed.
    images=(
      "gcr.io/oss-vdb/worker-base:${COMMIT_SHA}"
    )

    # Cloud Deploy pipelines promoted/created above. Each release stores its full
    # image list under buildArtifacts[].tag (e.g. gcr.io/oss-vdb/osv-worker:<sha>).
    pipelines=(
      gke-workers
      osv-api
      gke-indexer
      osv-website
      oss-fuzz-workers
    )

    for pipeline in "${pipelines[@]}"; do
      artifacts="$(
        gcloud deploy releases describe "osv-${SHORT_SHA}" \
          --project=oss-vdb \
          --region=us-central1 \
          --delivery-pipeline="${pipeline}" \
          --format='value[delimiter="\n"](buildArtifacts[].tag)'
      )"
      if [[ -z "${artifacts}" ]]; then
        echo "ERROR: No buildArtifacts found for ${pipeline} release osv-${SHORT_SHA}" >&2
        exit 1
      fi
      while IFS= read -r img; do
        if [[ -n "${img}" ]]; then
          images+=("${img}")
        fi
      done <<< "${artifacts}"
    done

    # Deduplicate (e.g. cron is in both gke-workers and oss-fuzz-workers) and attach
    # the release tag ($TAG_NAME) alongside each image's commit SHA tag.
    mapfile -t unique_images < <(printf '%s\n' "${images[@]}" | sort -u)
    echo "Tagging ${#unique_images[@]} images with ${TAG_NAME}:"

    failed=0
    for src in "${unique_images[@]}"; do
      # Only tag images hosted in our own projects' registries; skip third-party images.
      case "${src}" in
        gcr.io/oss-vdb/*|gcr.io/oss-vdb-test/*) ;;
        *)
          echo "  Skipping external image: ${src}"
          continue
          ;;
      esac

      # Strip any trailing @digest or :tag to derive the base image path.
      repo="${src%%@*}"
      repo="${repo%:*}"
      dst="${repo}:${TAG_NAME}"
      echo "  ${src} -> ${dst}"
      gcloud container images add-tag --quiet "${src}" "${dst}" || failed=1
    done

    exit "${failed}"

serviceAccount: 'projects/oss-vdb/serviceAccounts/deployment@oss-vdb.iam.gserviceaccount.com'
options:
  logging: CLOUD_LOGGING_ONLY
