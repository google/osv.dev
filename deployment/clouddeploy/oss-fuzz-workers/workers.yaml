apiVersion: apps/v1
kind: Deployment
metadata:
  name: workers
spec:
  replicas: 1
  selector:
    matchLabels:
      name: worker-private
  template:
    metadata:
      labels:
        name: worker-private
    spec:
      serviceAccountName: oss-fuzz-worker
      containers:
      - name: worker-private
        image: worker
        imagePullPolicy: Always
        env:
          - name: GOOGLE_CLOUD_PROJECT
            value: oss-vdb
        args:
          - "--ssh_key_public=/secrets/ssh.pub"
          - "--ssh_key_private=/secrets/ssh"
          - "--redis_host=10.102.25.213"
        volumeMounts:
          - mountPath: "/work"
            name: "ssd"
          - mountPath: "/secrets"
            name: "secrets"
        resources:
          requests:
            cpu: 1
            memory: "10G"
          limits:
            cpu: 2
            memory: "13G"
      volumes:
        - name: "ssd"
          hostPath:
            path: "/mnt/disks/ssd0/worker"
            type: DirectoryOrCreate
        - name: secrets
          secret:
            secretName: secrets
            items:
              - key: ssh
                path: ssh
                mode: 0600
              - key: ssh.pub
                path: ssh.pub
