apiVersion: batch/v1
kind: CronJob
metadata:
  name: nvd-mirror
spec:
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: osv-vulnfeeds
          containers:
          - name: nvd-mirror
            env:
            - name: GOOGLE_CLOUD_PROJECT
              value: oss-vdb-test
            - name: BUCKET
              value: osv-test-cve-osv-conversion
