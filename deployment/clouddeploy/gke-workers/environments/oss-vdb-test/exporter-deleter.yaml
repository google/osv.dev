apiVersion: batch/v1
kind: CronJob
metadata:
  name: exporter-deleter
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: exporter-deleter
            env:
            - name: GOOGLE_CLOUD_PROJECT
              value: oss-vdb-test
            args:
              - "--bucket=osv-test-vulnerabilities"
