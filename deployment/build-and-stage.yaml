# Build/push vulnfeeds images
# build-combine-to-osv warms the shared vulnfeeds/Dockerfile builder, gcloud-alpine-jq base,
# and BuildKit Go caches (/go/pkg/mod, /root/.cache/go-build). Subsequent vulnfeeds targets
# fan out into 2 bounded lanes via waitFor to cap BuildKit concurrency on E2_HIGHCPU_32:
#   Vulnfeeds Lane 1: alpine-cve-convert -> cve5-to-osv -> debian-convert -> cpe-repo-gen
#   Vulnfeeds Lane 2: debian-cve-convert -> debian-copyright-mirror -> nvd-cve-osv -> nvd-mirror
