apiVersion: monitoring.googleapis.com/v1
kind: ClusterPodMonitoring
metadata:
  # Must not be named 'kube-state-metrics', which GKE's cluster-infra-metrics
  # addon reconciles and overwrites for gke-managed-kube-state-metrics.
  name: osv-kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: google-cloud-managed-prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
      app.kubernetes.io/version: 2.14.0
  endpoints:
  - port: metrics
    # Customized from 30s to 5s.
    interval: 5s
    metricRelabeling:
    - action: keep
      # Only retain cronjob and job metrics here; pod and deployment metrics are
      # already scraped by GKE's managed kube-state-metrics ClusterPodMonitoring.
      regex: kube_(cronjob|job)(_.+)?
      sourceLabels: [__name__]
  targetLabels:
    metadata: [] # explicitly empty so the metric labels are respected
