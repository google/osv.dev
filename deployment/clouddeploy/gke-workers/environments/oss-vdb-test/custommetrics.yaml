apiVersion: apps/v1
kind: Deployment
metadata:
  name: custommetrics
spec:
  template:
    spec:
      containers:
      - name: custommetrics
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: oss-vdb-test
        - name: OSV_VULNERABILITIES_BUCKET
          value: osv-test-vulnerabilities
        - name: OSV_CVE_CONVERSION_BUCKET
          value: osv-test-cve-osv-conversion
        - name: CLUSTER_LOCATION
          value: us-west2-b
