apiVersion: apps/v1
kind: Deployment
metadata:
  name: custommetrics
spec:
  replicas: 1
  selector:
    matchLabels:
      name: custommetrics
  template:
    metadata:
      labels:
        name: custommetrics
    spec:
      containers:
      - name: custommetrics
        image: custommetrics
        imagePullPolicy: Always
        ports:
        - name: metrics
          containerPort: 9090
        resources:
          requests:
            cpu: "10m"
            memory: "256Mi"
          limits:
            cpu: "200m"
            memory: "512Mi"
