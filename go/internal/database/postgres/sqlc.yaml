version: "2"
sql:
  - engine: "postgresql"
    schema: "../../../../db_test"
    queries: "queries.sql"
    gen:
      go:
        package: "postgres"
        out: "."
        sql_package: "pgx/v5"
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "jsonb"
            go_type:
              type: "[]byte"
