apiVersion: batch/v1
kind: CronJob
metadata:
  name: combine-to-osv
  labels:
    cronLastSuccessfulTimeMins: "2160"
spec:
  timeZone: Australia/Sydney
  schedule: "30 13,21 * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      template:
        spec:
          containers:
          - name: combine-to-osv
            image: combine-to-osv
            imagePullPolicy: Always
            resources:
              requests:
                cpu: "4"
                memory: "4G"
              limits:
                cpu: "7"
                memory: "8G"
          restartPolicy: Never # on the assumption that the next scheduled run is soon enough
