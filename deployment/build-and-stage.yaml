- name: gcr.io/cloud-builders/docker
  args: ['push', '--all-tags', 'gcr.io/oss-vdb/debian-copyright-mirror']
  waitFor: ['build-debian-copyright-mirror', 'cloud-build-queue']

# Build/push CPE repo map generating image
- name: gcr.io/cloud-builders/docker
  args: ['buildx', 'build', '--load', '-t', 'gcr.io/oss-vdb/cpe-repo-gen:latest', '-t', 'gcr.io/oss-vdb/cpe-repo-gen:$COMMIT_SHA', '--target', 'cpe-repo-gen', '-f', 'Dockerfile', '--pull', '.']
  dir: 'vulnfeeds'
  id: 'build-cpe-repo-gen'
  waitFor: ['build-debian-convert']
  volumes:
  - name: 'docker-config'
    path: '/root/.docker'
- name: gcr.io/cloud-builders/docker
  args: ['push', '--all-tags', 'gcr.io/oss-vdb/cpe-repo-gen']
  waitFor: ['build-cpe-repo-gen', 'cloud-build-queue']

# Build/push NVD CVE to OSV conversion image
- name: gcr.io/cloud-builders/docker
  args: ['buildx', 'build', '--load', '-t', 'gcr.io/oss-vdb/nvd-cve-osv:latest', '-t', 'gcr.io/oss-vdb/nvd-cve-osv:$COMMIT_SHA', '--target', 'nvd-cve-osv', '-f', 'Dockerfile', '--pull', '.']
  dir: 'vulnfeeds'
  id: 'build-nvd-cve-osv'
  waitFor: ['build-debian-copyright-mirror']
  volumes:
  - name: 'docker-config'
    path: '/root/.docker'
- name: gcr.io/cloud-builders/docker
  args: ['push', '--all-tags', 'gcr.io/oss-vdb/nvd-cve-osv']
  waitFor: ['build-nvd-cve-osv', 'cloud-build-queue']

# Build website frontend assets
- name: 'node:24.18'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    corepack enable pnpm
    pnpm install --frozen-lockfile --ignore-scripts
    pnpm run build:prod
  dir: 'website/frontend3'
  id: 'build-frontend3'
  waitFor: ['setup']

- name: 'gcr.io/cloud-builders/git'
  entrypoint: 'bash'
  args: ['-c', 'mkdir -p website/dist/static/blog && chmod a+rx website/dist website/dist/static && chmod 777 website/dist/static/blog']
  id: 'prep-hugo'
  waitFor: ['setup']

- name: 'ghcr.io/gohugoio/hugo:v0.170.1@sha256:4cc9f383086c0fba180efcf7132cf2f025969c462fedf5fcd2bf921915416797'
  entrypoint: 'hugo'
  args: ['--noBuildLock', '--buildFuture', '-d', '../dist/static/blog']
  dir: 'website/blog'
  id: 'build-hugo'
  waitFor: ['prep-hugo']

# Build/push Website image
- name: 'gcr.io/cloud-builders/docker'
  args: ['buildx', 'build', '--load', '--build-arg', 'BUILDKIT_INLINE_CACHE=1',
         '-t', 'gcr.io/oss-vdb/osv-website:latest', '-t', 'gcr.io/oss-vdb/osv-website:$COMMIT_SHA',
         '--target', 'website',
         '--build-context', 'bindings=../bindings',
         '--build-context', 'website-dist=../website/dist',
         '--build-context', 'docs=../docs',
         '-f', 'Dockerfile', '--cache-from', 'gcr.io/oss-vdb/osv-website:latest', '--pull', '.']
  dir: 'go'
  id: 'build-website'
  waitFor: ['build-importer', 'build-frontend3', 'build-hugo']
  volumes:
  - name: 'docker-config'
    path: '/root/.docker'
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '--all-tags', 'gcr.io/oss-vdb/osv-website']
  waitFor: ['build-website', 'cloud-build-queue']

# Build/push NVD mirror image
- name: gcr.io/cloud-builders/docker
  args: ['buildx', 'build', '--load', '-t', 'gcr.io/oss-vdb/nvd-mirror:latest', '-t', 'gcr.io/oss-vdb/nvd-mirror:$COMMIT_SHA', '--target', 'nvd-mirror', '-f', 'Dockerfile', '--pull', '.']
  dir: 'vulnfeeds'
  id: 'build-nvd-mirror'
  waitFor: ['build-nvd-cve-osv']
  volumes:
  - name: 'docker-config'
    path: '/root/.docker'
- name: gcr.io/cloud-builders/docker
  args: ['push', '--all-tags', 'gcr.io/oss-vdb/nvd-mirror']
  waitFor: ['build-nvd-mirror', 'cloud-build-queue']

# Apply Terraform config to staging environment
# TODO(michaelkedar): regenerate the api protobufs?
- name: gcr.io/oss-vdb/terraform
  args: ['init', '-no-color']
  dir:  deployment/terraform/environments/oss-vdb-test
  id: 'terraform-init'
  waitFor: ['setup']
# no waitFor means wait for every previous step to complete
- name: gcr.io/oss-vdb/terraform
  args: ['apply', '-no-color', '-auto-approve']
  dir:  deployment/terraform/environments/oss-vdb-test
  id: 'terraform-apply'

# Apply PostgreSQL schema migrations to staging environment
- name: gcr.io/oss-vdb/goose
  env: ['CLOUDSQL_INSTANCE=oss-vdb-test:us-central1:osv-db']
  args: ['up']
  dir:  go/internal/database/postgres/migrations
  id: 'goose-up'

# Cloud Deploy
# GKE Workers
- name: 'gcr.io/cloud-builders/gcloud'
  args: ['deploy', 'releases', 'create', 'osv-$SHORT_SHA', '--project=oss-vdb', '--region=us-central1',
    '--delivery-pipeline=gke-workers', '--images',
    "worker=gcr.io/oss-vdb/osv-worker:$COMMIT_SHA,\
     importer=gcr.io/oss-vdb/importer:$COMMIT_SHA,\
     exporter=gcr.io/oss-vdb/exporter:$COMMIT_SHA,\
     exporter-deleter=gcr.io/oss-vdb/exporter-deleter:$COMMIT_SHA,\
     staging-api-test=gcr.io/oss-vdb-test/staging-api-test:$COMMIT_SHA,\
     osv-linter=gcr.io/oss-vdb-test/osv-linter:$COMMIT_SHA,\
     debian-convert=gcr.io/oss-vdb/debian-convert:$COMMIT_SHA,\
     run_first_package_finder=gcr.io/oss-vdb/run_first_package_finder:$COMMIT_SHA,\
     combine-to-osv=gcr.io/oss-vdb/combine-to-osv:$COMMIT_SHA,\
     alpine-cve-convert=gcr.io/oss-vdb/alpine-cve-convert:$COMMIT_SHA,\
     debian-cve-convert=gcr.io/oss-vdb/debian-cve-convert:$COMMIT_SHA,\
     debian-copyright-mirror=gcr.io/oss-vdb/debian-copyright-mirror:$COMMIT_SHA,\
     cpe-repo-gen=gcr.io/oss-vdb/cpe-repo-gen:$COMMIT_SHA,\
     nvd-cve-osv=gcr.io/oss-vdb/nvd-cve-osv:$COMMIT_SHA,\
     nvd-mirror=gcr.io/oss-vdb/nvd-mirror:$COMMIT_SHA,\
     recoverer=gcr.io/oss-vdb/recoverer:$COMMIT_SHA,\
     cve5-to-osv=gcr.io/oss-vdb/cve5-to-osv:$COMMIT_SHA,\
     record-checker=gcr.io/oss-vdb/record-checker:$COMMIT_SHA,\
     custommetrics=gcr.io/oss-vdb/custommetrics:$COMMIT_SHA,\
     relations=gcr.io/oss-vdb/relations:$COMMIT_SHA,\
     generatesitemap=gcr.io/oss-vdb/generatesitemap:$COMMIT_SHA,\
     gitter=gcr.io/oss-vdb/gitter:$COMMIT_SHA,\
     vanir-signatures=gcr.io/oss-vdb/vanir-signatures:$COMMIT_SHA,\
     ubuntu-binary-mapper=gcr.io/oss-vdb/ubuntu-binary-mapper:$COMMIT_SHA,\
     cron=gcr.io/oss-vdb/cron:$COMMIT_SHA"
  ]
  dir: deployment/clouddeploy/gke-workers
  id: 'deploy-gke-workers'
  waitFor: ['goose-up']

# API Backend
- name: 'gcr.io/cloud-builders/gcloud'
  args: ['deploy', 'releases', 'create', 'osv-$SHORT_SHA', '--project=oss-vdb', '--region=us-central1',
    '--delivery-pipeline=osv-api', '--images',
    "osv-server=gcr.io/oss-vdb/osv-server:$COMMIT_SHA"
  ]
  dir: deployment/clouddeploy/osv-api
  id: 'deploy-osv-api'
  waitFor: ['goose-up']

# Indexer
- name: 'gcr.io/cloud-builders/gcloud'
  args: ['deploy', 'releases', 'create', 'osv-$SHORT_SHA', '--project=oss-vdb', '--region=us-central1',
    '--delivery-pipeline=gke-indexer', '--images',
    "indexer=gcr.io/oss-vdb/indexer:$COMMIT_SHA"
  ]
  dir: deployment/clouddeploy/gke-indexer
  id: 'deploy-gke-indexer'
  waitFor: ['goose-up']

# Website
- name: 'gcr.io/cloud-builders/gcloud'
  args: ['deploy', 'releases', 'create', 'osv-$SHORT_SHA', '--project=oss-vdb', '--region=us-central1',
    '--delivery-pipeline=osv-website', '--images',
    "osv-website=gcr.io/oss-vdb/osv-website:$COMMIT_SHA"
  ]
  dir: deployment/clouddeploy/osv-website
  id: 'deploy-osv-website'
  waitFor: ['goose-up']

timeout: 7200s
# Also set in Cloud Build:
serviceAccount: 'projects/oss-vdb/serviceAccounts/deployment@oss-vdb.iam.gserviceaccount.com'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_32
  env:
  - BUILDKIT_PROGRESS=plain

tags: ['build-and-stage']
