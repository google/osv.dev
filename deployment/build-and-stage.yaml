  dir: 'vulnfeeds'
  id: 'build-alpine-cve-convert'
  waitFor: ['build-combine-to-osv']
  volumes:
  - name: 'docker-config'
    path: '/root/.docker'
- name: gcr.io/cloud-builders/docker
