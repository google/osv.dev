apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: vanir-sandbox
description: Vanir sandbox Cloud Run pipeline
serialPipeline:
  stages:
  - targetId: staging-vanir-sandbox
    profiles: [ staging ]
  - targetId: production-vanir-sandbox
    profiles: [ prod ]
---

apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: staging-vanir-sandbox
description: oss-vdb-test vanir-sandbox instance
run:
  location: projects/oss-vdb-test/locations/us-west2
executionConfigs:
- usages:
  - RENDER
  - DEPLOY
  serviceAccount: deployment@oss-vdb.iam.gserviceaccount.com
---

apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: production-vanir-sandbox
description: oss-vdb vanir-sandbox instance
run:
  location: projects/oss-vdb/locations/us-west2
executionConfigs:
- usages:
  - RENDER
  - DEPLOY
  serviceAccount: deployment@oss-vdb.iam.gserviceaccount.com
