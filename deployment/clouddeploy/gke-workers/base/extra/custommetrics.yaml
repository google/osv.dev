apiVersion: apps/v1
kind: Deployment
metadata:
  name: custommetrics
spec:
  replicas: 1
  selector:
    matchLabels:
      name: custommetrics
  template:
    metadata:
      labels:
        name: custommetrics
    spec:
      containers:
      - name: custommetrics
        image: custommetrics
        imagePullPolicy: Always
        env:
          # Soft memory limit for the Go runtime, ~90% of limits.memory, so the GC
          # works harder before the container gets OOM-killed.
          # Keep in sync with limits.memory below.
          - name: GOMEMLIMIT
            value: "900MiB"
        ports:
        - name: metrics
          containerPort: 9090
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "200m"
            memory: "1Gi"
