apiVersion: batch/v1
kind: CronJob
metadata:
  name: osv-linter
  labels:
    cronLastSuccessfulTimeMins: "240"
spec:
  timeZone: Australia/Sydney
  schedule: "0 */2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: osv-linter
            image: osv-linter
            imagePullPolicy: Always
            env:
            - name: GOOGLE_CLOUD_PROJECT
              value: "oss-vdb-test"
            args:
            - "--dry-run=false"
            resources:
              requests:
                cpu: 1.5
                memory: "10G"
              limits:
                cpu: 2
                memory: "30G"
          restartPolicy: Never