apiVersion: batch/v1
kind: CronJob
metadata:
  name: relations
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: relations
            env:
            - name: GOOGLE_CLOUD_PROJECT
              value: oss-vdb-test
            - name: OSV_VULNERABILITIES_BUCKET
              value: osv-test-vulnerabilities
            - name: OSV_FAILED_TASKS_TOPIC
              value: failed-tasks
            - name: POSTGRES_HOST
              value: "172.24.1.3"
            args:
            - --breakdown-prefixes=ALSA-,BIT-,CGA-{{0..9},{a..z}},CVE-,DLA-,DSA-,GHSA-,GO-,MAL-,MGASA-,OSV-,PYSEC-,RLSA-,RUSTSEC-,SUSE-,UBUNTU-
