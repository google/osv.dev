apiVersion: batch/v1
kind: CronJob
metadata:
  name: importer
  labels:
    cronLastSuccessfulTimeMins: "90"
spec:
  timeZone: "Australia/Sydney"
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: importer
            image: importer
            imagePullPolicy: Always
            env:
              - name: GITTER_HOST
                value: http://gitter-service:8888
              - name: IMPORT_TRACE_SAMPLE_RATE # for the overall importer trace
                value: "1.0"
              - name: TRACE_SAMPLE_RATE # for the individual vulnerability entries
                value: "0.05"
              - name: DEFAULT_TASK_POOL
                value: "default"
              - name: REIMPORT_TASK_POOL
                value: "reimport"
            resources:
              requests:
                cpu: "3"
                memory: "24G"
              limits:
                cpu: "4"
                memory: "29G"
          restartPolicy: Never
