[project]
name = "osv"
version = "0.1.2"
description = "Shim for the osv library in vanir to use the latest versions of the OSV proto"
requires-python = ">=3.13"
dependencies = [
]

[dependency-groups]
dev = [
    "protobuf (>=6.33.6,<7.0.0)",
    "grpcio-tools"
]

[tool.poetry]
packages = [
    { include = "vulnerability_pb2.py", to = "osv" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

