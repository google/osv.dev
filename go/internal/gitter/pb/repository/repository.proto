syntax = "proto3";

package gitter;

option go_package = "./repository";

import "google/protobuf/timestamp.proto";

message CommitDetail {
    bytes hash = 1;
    bytes patch_id = 2;
}

// RepositoryCache contains only immutable information of a repository (commit hash and the associated patch ID)
// Other git-related structures such as refs and the actual graph are to be constructed when a request comes in.
message RepositoryCache {
    repeated CommitDetail commits = 1;
}

message Commit {
    bytes hash = 1;
}

message Ref {
    string label = 1;
    bytes hash = 2;
}

message AffectedCommitsResponse {
    repeated Commit commits = 1;
    repeated Ref tags = 2;
    repeated Event cherry_picked_events = 3;
}

message TagsResponse {
    repeated Ref tags = 1;
}

enum EventType {
    INTRODUCED = 0;
    FIXED = 1;
    LAST_AFFECTED = 2;
    LIMIT = 3;
}

message Event {
    EventType event_type = 1;
    string hash = 2;
}

message CacheRequest {
    string url = 1;
    bool force_update = 2;
    string ref_id = 3; // Optional reference ID for tracing
}

message AffectedCommitsRequest {
    string url = 1;
    repeated Event events = 2;
    bool detect_cherrypicks_introduced = 3;
    bool detect_cherrypicks_fixed = 4;
    bool detect_cherrypicks_limit = 5;
    bool force_update = 6;
    bool consider_all_branches = 7;
    string ref_id = 8; // Optional reference ID for tracing
}

message FileChange {
    string from_path = 1;
    string to_path = 2;
}

message FileDiffsRequest {
    string url = 1;
    string last_synced_commit = 2; // Empty last_synced_commit will diff against empty tree (return all files)
    string branch = 3;             // Optional, defaults to remote HEAD (origin/HEAD) if not specified
}

message FileDiffsResponse {
    string latest_commit = 1;
    repeated FileChange changes = 2;
}

message FileContentRequest {
    string url = 1;
    string commit = 2;
    string path = 3;
}

message FileContentResponse {
    bytes content = 1;
}

message CommitDiff {
    string commit = 1;
    google.protobuf.Timestamp timestamp = 2;
    string message = 3;
    string patch = 4;
    repeated FileChange files_changed = 5;
    bool patch_truncated = 6;
}

message CommitDiffsRequest {
    string url = 1;
    string branch = 2;                            // Optional, defaults to remote default branch (origin/HEAD)
    string last_scan_commit = 3;                  // Optional, SHA of last scanned commit, preferred over last_scan_time when provided
    google.protobuf.Timestamp last_scan_time = 4; // Optional, timestamp of last scan. Used as fallback if last_scan_commit is not provided or is no longer on the branch.
    bool newest_first = 5;                        // Optional, if true, newest commits first. Defaults to false (chronological order).
    repeated string include_paths = 6;            // Optional, paths/globs to include in diffs
    repeated string exclude_paths = 7;            // Optional, paths/globs to exclude from diffs
}

message CommitDiffsResponse {
    string url = 1;
    string branch = 2;
    string head_commit = 3;
    int32 num_commits = 4;
    repeated CommitDiff commits = 5;
}
