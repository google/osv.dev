apiVersion: 1
datasources:
  - name: Prometheus (GMP)
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 2.45.0
      timeInterval: 15s
    editable: false

  - name: Google Cloud Monitoring
    type: googlecloud-monitoring-datasource
    access: proxy
    jsonData:
      authenticationType: gce
    editable: false

  - name: Google Cloud Logging
    type: googlecloud-logging-datasource
    access: proxy
    jsonData:
      authenticationType: gce
    editable: false

  - name: Infinity (GCS Scorecards)
    type: yesoreyeram-infinity-datasource
    access: proxy
    jsonData:
      auth_method: bearerToken
      bearer_token_type: gcp
    editable: false
