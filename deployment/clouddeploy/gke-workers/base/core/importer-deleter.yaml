apiVersion: batch/v1
kind: CronJob
metadata:
  name: importer-deleter
  labels:
    cronLastSuccessfulTimeMins: "360"
spec:
  timeZone: "Australia/Sydney"
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: importer-deleter
              image: importer
              imagePullPolicy: Always
              env:
                - name: DEFAULT_TASK_POOL
                  value: "default"
              resources:
                requests:
                  cpu: "1"
                  memory: "10G"
                limits:
                  cpu: "2"
                  memory: "11G"
          restartPolicy: Never
