- name: gcr.io/cloud-builders/docker
  args: ['buildx', 'build', '--load', '-t', 'gcr.io/oss-vdb/exporter-deleter:latest', '-t', 'gcr.io/oss-vdb/exporter-deleter:$COMMIT_SHA', '--target', 'exporter-deleter', '--build-context', 'bindings=../bindings', '-f', 'Dockerfile', '--pull', '.']
  dir: 'go'
  id: 'build-exporter-deleter'
