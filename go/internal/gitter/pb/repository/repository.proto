syntax = "proto3";

package gitter;

option go_package = "./repository";

import "google/protobuf/timestamp.proto";

message CommitDetail {
    bytes hash = 1;
    bytes patch_id = 2;
}

// RepositoryCache contains only immutable information of a repository (commit hash and the associated patch ID)
// Other git-related structures such as refs and the actual graph are to be constructed when a request comes in.
message RepositoryCache {
    repeated CommitDetail commits = 1;
}

message Commit {
    bytes hash = 1;
}

message Ref {
    string label = 1;
    bytes hash = 2;
}

message AffectedCommitsResponse {
    repeated Commit commits = 1;
    repeated Ref tags = 2;
    repeated Event cherry_picked_events = 3;
}

message TagsResponse {
    repeated Ref tags = 1;
}

enum EventType {
    INTRODUCED = 0;
    FIXED = 1;
    LAST_AFFECTED = 2;
    LIMIT = 3;
}

message Event {
    EventType event_type = 1;
    string hash = 2;
}

message CacheRequest {
    string url = 1;
    bool force_update = 2;
    string ref_id = 3; // Optional reference ID for tracing
}

message AffectedCommitsRequest {
    string url = 1;
    repeated Event events = 2;
    bool detect_cherrypicks_introduced = 3;
    bool detect_cherrypicks_fixed = 4;
    bool detect_cherrypicks_limit = 5;
    bool force_update = 6;
    bool consider_all_branches = 7;
    string ref_id = 8; // Optional reference ID for tracing
    // Optional pre-walk tag spur resolution for repositories that tag releases on dead-end
    // off-branch commits (e.g. php-src). Enabling any of these flags forces consider_all_branches = true.

    // For an INTRODUCED release tag spur, additionally mark its parent-branch fork commit as INTRODUCED.
    bool resolve_tag_spur_introduced = 9;
    // For a FIXED release tag spur, additionally mark the continuation after its parent-branch fork commit as FIXED.
    bool resolve_tag_spur_fixed = 10;
    // For a LAST_AFFECTED release tag spur, additionally mark the continuation after its parent-branch fork commit as FIXED.
    bool resolve_tag_spur_last_affected = 11;
    // Max length (in commits) of a release tag spur in this repo. Defaults to 1; must be <= 100.
    int32 resolve_tag_spur_max_length = 12;
}

message FileChange {
    string from_path = 1;
    string to_path = 2;
}

message FileDiffsRequest {
    string url = 1;
    string last_synced_commit = 2; // Empty last_synced_commit will diff against empty tree (return all files)
    string branch = 3;             // Optional, defaults to remote HEAD (origin/HEAD) if not specified
}

message FileDiffsResponse {
    string latest_commit = 1;
    repeated FileChange changes = 2;
}

message FileContentRequest {
    string url = 1;
    string commit = 2;
    string path = 3;
}

message FileContentResponse {
    bytes content = 1;
}

message CommitDiff {
    string commit = 1;
    google.protobuf.Timestamp timestamp = 2;
    string message = 3;
    string patch = 4;
    repeated FileChange files_changed = 5;
    bool patch_truncated = 6;
}

message CommitDiffsRequest {
    string url = 1;
    string branch = 2;                            // Optional, defaults to remote default branch (origin/HEAD)
    string last_synced_commit = 3;                // Optional, SHA of last synced commit, preferred over last_synced_time when provided
    google.protobuf.Timestamp last_synced_time = 4; // Optional, timestamp of last sync. Used as fallback if last_synced_commit is not provided or is no longer on the branch.
    bool newest_first = 5;                        // Optional, if true, newest commits first. Defaults to false (chronological order).
    repeated string include_paths = 6;            // Optional, paths/globs to include in diffs
    repeated string exclude_paths = 7;            // Optional, paths/globs to exclude from diffs
}

message CommitDiffsResponse {
    string url = 1;
    string branch = 2;
    string latest_commit = 3;
    int32 num_commits = 4;
    repeated CommitDiff commits = 5;
}
