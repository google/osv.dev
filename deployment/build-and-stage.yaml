- name: gcr.io/cloud-builders/docker
  args: ['buildx', 'build', '--load', '-t', 'gcr.io/oss-vdb/relations:latest', '-t', 'gcr.io/oss-vdb/relations:$COMMIT_SHA', '--target', 'relations', '--build-context', 'bindings=../bindings', '-f', 'Dockerfile', '--pull', '.']
  dir: 'go'
