apiVersion: v1
kind: ServiceAccount
metadata:
  name: oss-fuzz-worker
  annotations:
    iam.gke.io/gcp-service-account: oss-fuzz-worker@oss-vdb.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oss-fuzz-importer
  annotations:
    iam.gke.io/gcp-service-account: oss-fuzz-importer@oss-vdb.iam.gserviceaccount.com
---
# Uses the default compute SA for Issue Tracker access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oss-fuzz-make-bugs-public
  annotations:
    iam.gke.io/gcp-service-account: 651737493649-compute@developer.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oss-fuzz-process-results
  annotations:
    iam.gke.io/gcp-service-account: oss-fuzz-process-results@oss-vdb.iam.gserviceaccount.com
---
# Annotates the existing custom-metrics-stackdriver-adapter KSA (installed via
# deployment/README.md) so HPA keeps working once GKE_METADATA is enabled.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: custom-metrics-stackdriver-adapter
  namespace: custom-metrics
  annotations:
    iam.gke.io/gcp-service-account: oss-fuzz-metrics-adapter@oss-vdb.iam.gserviceaccount.com
