apiVersion: apps/v1
kind: Deployment
metadata:
  name: workers
spec:
  replicas: 1
  selector:
    matchLabels:
      name: worker-private
  template:
    metadata:
      labels:
        name: worker-private
    spec:
      containers:
      - name: worker-private
        image: worker
        imagePullPolicy: Always
        env:
          - name: GITTER_HOST
            value: http://gitter-service:8888
          - name: PUBSUB_SUBSCRIPTION
            value: default
          - name: DATASTORE_DATABASE_ID
            value: "" # default
          - name: FAILED_TASKS_TOPIC
            value: failed-tasks
          - name: NOTIFY_PYPI
            value: "false"
          # Soft memory limit for the Go runtime, ~90% of limits.memory, so the GC
          # works harder before the container gets OOM-killed.
          # Keep in sync with limits.memory below.
          - name: GOMEMLIMIT
            value: "3060MiB"
        ports:
        - name: metrics
          containerPort: 9090
        # limits.memory is sized so that 8 workers (the most that fit on an
        # n4-standard-8 node by CPU request) should all be able to max out at 
        # once without exceeding the node's allocatable memory.
        resources:
          requests:
            cpu: "0.9"
            memory: "1.2Gi"
          limits:
            cpu: "2"
            memory: "3400Mi"
