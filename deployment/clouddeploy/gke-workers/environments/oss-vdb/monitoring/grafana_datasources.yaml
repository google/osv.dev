apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: GMP (Prod)
        uid: gmp-prod
        type: prometheus
        access: proxy
        url: http://127.0.0.1:9090
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 15s
      - name: GMP (Test)
        uid: gmp-test
        type: prometheus
        access: proxy
        url: http://127.0.0.1:9091
        isDefault: false
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 15s
      - name: Cloud Monitoring
        uid: cloud-monitoring
        type: stackdriver
        access: proxy
        editable: false
        jsonData:
          authenticationType: gce
          defaultProject: oss-vdb
