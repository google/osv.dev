# Repository allowlist configuration
# Supports exact URLs (type: url) and regex (Go RE2 syntax) patterns (type: regex).
# Example:
# - type: url
#   value: "https://github.com/google/osv.dev.git"
#   consider_all_branches: true
#   cherrypicks: true                   # Shorthand: sets introduced, fixed, and limit to true
# - type: url
#   value: "https://github.com/apache/hadoop.git"
#   consider_all_branches: true
#   cherrypicks: true
#   cherrypicks_fixed: false            # Specific override for fixed
# - type: regex
#   value: 'github\.com/google/osv-.*'
#   consider_all_branches: true
